version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: auth-redis
    command: redis-server --requirepass 123 --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aeros_network
    restart: unless-stopped

  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: auth-redis-insight
    ports:
      - "5540:5540"
    environment:
      - REDIS_HOSTS=redis://:123@redis:6379
    depends_on:
      - redis
    networks:
      - aeros_network
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: flights
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "123"
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - aeros_network

networks:
  aeros_network:
    driver: bridge
