openapi: 3.0.3
info:
  title: Users API
  version: 1.0.0
  description: HTTP API for user registration, profile lookup, and account activation.
servers:
  - url: http://localhost:3002
    description: Local development server
tags:
  - name: Users
    description: User account endpoints

paths:
  /api/v1/users/registration:
    post:
      tags: [Users]
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: User was created and an access token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensResponse'
        '400':
          description: Validation failed or request payload is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User with the same email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error during registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      operationId: getUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to load profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{userId}/activate:
    post:
      tags: [Users]
      summary: Activate a user account
      operationId: activateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIDPath'
      responses:
        '200':
          description: User account was activated successfully.
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The user is not allowed to activate this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User is already activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to activate the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserIDPath:
      name: userId
      in: path
      required: true
      description: User UUID to activate.
      schema:
        type: string
        format: uuid

  schemas:
    RegisterUserRequest:
      type: object
      required:
        - name
        - email
        - birthday
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
          description: Full user name. Only letters and spaces are allowed.
        email:
          type: string
          format: email
          maxLength: 255
        birthday:
          type: string
          format: date-time
          description: User birth date in RFC3339 format.
        password:
          type: string
          minLength: 8
          description: Password used for registration.

    TokensResponse:
      type: object
      required:
        - access_token
      properties:
        access_token:
          type: string
          description: JWT access token returned after successful registration.

    UserResponse:
      type: object
      required:
        - id
        - name
        - birthday
        - email
        - is_activated
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        birthday:
          type: string
          format: date-time
        email:
          type: string
          format: email
        is_activated:
          type: boolean
        activated_at:
          type: string
          format: date-time
          nullable: true
          description: Activation timestamp, if the user has already been activated.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message returned by the service.
