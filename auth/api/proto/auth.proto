syntax = "proto3";

package auth;

option go_package = "./auth";

service Auth {
  rpc AddUser(AddUserRequest) returns (AddUserResponse);
}

message AddUserRequest {
  string id = 1;
  string email = 2;
  string password = 3;
}

message AddUserResponse {
  string access_token = 1;
  string refresh_token = 2;
}
