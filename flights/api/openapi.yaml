openapi: 3.0.3
info:
  title: Flights API
  version: 1.0.0
  description: HTTP API for searching, creating, deleting, cancelling, rescheduling, and updating flight status.
servers:
  - url: http://localhost:3000
    description: Local server
tags:
  - name: Flights
    description: Flight management operations
  - name: Cargo
    description: Cargo manifests and manifest items
paths:
  /api/v1/flights:
    get:
      tags:
        - Flights
      summary: Search flights
      operationId: getFlights
      parameters:
        - $ref: '#/components/parameters/FlightNumberQuery'
        - $ref: '#/components/parameters/OriginQuery'
        - $ref: '#/components/parameters/DestinationQuery'
        - name: status
          in: query
          description: Exact flight status filter.
          schema:
            $ref: '#/components/schemas/FlightStatus'
        - name: date_from
          in: query
          description: Inclusive lower bound for the flight date. Must be RFC3339.
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          description: Inclusive upper bound for the flight date. Must be RFC3339.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Flights returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Flights could not be retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Flights
      summary: Create a flight
      operationId: createFlight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFlightRequest'
      responses:
        '201':
          description: Flight created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Flight could not be created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/flights/{id}:
    delete:
      tags:
        - Flights
      summary: Delete a flight
      operationId: deleteFlight
      parameters:
        - $ref: '#/components/parameters/FlightIDPath'
      responses:
        '204':
          description: Flight deleted successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Flight could not be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/flights/{id}/cancel:
    post:
      tags:
        - Flights
      summary: Cancel a flight
      operationId: cancelFlight
      parameters:
        - $ref: '#/components/parameters/FlightIDPath'
      responses:
        '200':
          description: Flight cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Flight was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Flight could not be cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/flights/{id}/reschedule:
    post:
      tags:
        - Flights
      summary: Reschedule a flight
      operationId: rescheduleFlight
      parameters:
        - $ref: '#/components/parameters/FlightIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleFlightRequest'
      responses:
        '200':
          description: Flight rescheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Flight was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Flight could not be rescheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/flights/{id}/status:
    post:
      tags:
        - Flights
      summary: Change a flight status
      operationId: changeFlightStatus
      parameters:
        - $ref: '#/components/parameters/FlightIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
      responses:
        '200':
          description: Flight status changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Flight was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Flight status could not be changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/cargo/{id}:
    get:
      tags: [Cargo]
      summary: Get a cargo manifest
      operationId: getCargoManifest
      parameters:
        - $ref: '#/components/parameters/CargoManifestIDPath'
      responses:
        '200':
          description: Cargo manifest returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoManifest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cargo/{id}/items:
    get:
      tags: [Cargo]
      summary: List items in a cargo manifest
      operationId: getCargoItems
      parameters:
        - $ref: '#/components/parameters/CargoManifestIDPath'
      responses:
        '200':
          description: Cargo items returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CargoItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cargo/{id}/items/{item_id}:
    get:
      tags: [Cargo]
      summary: Get one cargo item
      operationId: getCargoItem
      parameters:
        - $ref: '#/components/parameters/CargoManifestIDPath'
        - $ref: '#/components/parameters/CargoItemIDPath'
      responses:
        '200':
          description: Cargo item returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cargo/{id}/add:
    post:
      tags: [Cargo]
      summary: Add an item to a cargo manifest
      operationId: addCargoItem
      parameters:
        - $ref: '#/components/parameters/CargoManifestIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCargoItemRequest'
      responses:
        '201':
          description: Cargo item created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cargo/{id}/delete/{item_id}:
    delete:
      tags: [Cargo]
      summary: Delete an item from a cargo manifest
      operationId: deleteCargoItem
      parameters:
        - $ref: '#/components/parameters/CargoManifestIDPath'
        - $ref: '#/components/parameters/CargoItemIDPath'
      responses:
        '204':
          description: Cargo item deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cargo/{id}/move:
    post:
      tags: [Cargo]
      summary: Move an item to another cargo manifest
      operationId: moveCargoItem
      parameters:
        - $ref: '#/components/parameters/CargoManifestIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCargoItemRequest'
      responses:
        '200':
          description: Cargo item moved (empty response body).
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    FlightIDPath:
      name: id
      in: path
      required: true
      description: UUID of the flight.
      schema:
        type: string
        format: uuid
    CargoManifestIDPath:
      name: id
      in: path
      required: true
      description: UUID of the cargo manifest.
      schema:
        type: string
        format: uuid
    CargoItemIDPath:
      name: item_id
      in: path
      required: true
      description: UUID of the cargo item.
      schema:
        type: string
        format: uuid
    FlightNumberQuery:
      name: flight_number
      in: query
      description: Exact flight number filter. Whitespace is trimmed and letters are uppercased.
      schema:
        type: string
        maxLength: 8
    OriginQuery:
      name: origin
      in: query
      description: Three-letter IATA origin airport code filter. Whitespace is trimmed and letters are uppercased.
      schema:
        type: string
        maxLength: 3
        pattern: '^[A-Za-z]{3}$'
    DestinationQuery:
      name: destination
      in: query
      description: Three-letter IATA destination airport code filter. Whitespace is trimmed and letters are uppercased.
      schema:
        type: string
        maxLength: 3
        pattern: '^[A-Za-z]{3}$'
    PageQuery:
      name: page
      in: query
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      name: limit
      in: query
      description: Number of flights per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  schemas:
    FlightStatus:
      type: string
      enum:
        - Scheduled
        - CheckIn
        - Boarding
        - Delayed
        - Departed
        - Arrived
        - Cancelled
        - Redirected

    Flight:
      type: object
      required:
        - id
        - flight_number
        - origin
        - destination
        - date
        - status
        - aircraft
      properties:
        id:
          type: string
          format: uuid
        flight_number:
          type: string
          maxLength: 8
        origin:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Za-z]{3}$'
        destination:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Za-z]{3}$'
        date:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/FlightStatus'
        aircraft:
          type: string

    CreateFlightRequest:
      type: object
      required:
        - flight_number
        - origin
        - destination
        - date
        - aircraft
      properties:
        flight_number:
          type: string
          maxLength: 8
        origin:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Za-z]{3}$'
        destination:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Za-z]{3}$'
        date:
          type: string
          format: date-time
          description: RFC3339 timestamp strictly later than the current server time.
        status:
          allOf:
            - $ref: '#/components/schemas/FlightStatus'
          default: Scheduled
        aircraft:
          type: string

    RescheduleFlightRequest:
      type: object
      required:
        - new_date
      properties:
        new_date:
          type: string
          format: date-time

    ChangeStatusRequest:
      type: object
      required:
        - new_status
      properties:
        new_status:
          $ref: '#/components/schemas/FlightStatus'

    FlightResponse:
      $ref: '#/components/schemas/Flight'

    FlightListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Flight'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      required:
        - page
        - limit
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100

    ActionResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    CargoType:
      type: string
      enum: [Luggage, Cargo, Mail, Equipment, Dangerous]

    CargoItem:
      type: object
      required: [id, cargo_type, weight_kg, description]
      properties:
        id:
          type: string
          format: uuid
        cargo_type:
          $ref: '#/components/schemas/CargoType'
        weight_kg:
          type: integer
          minimum: 1
        passenger_id:
          type: string
          format: uuid
          description: Required by business rules for Luggage items.
        description:
          type: string
          minLength: 5

    CargoManifest:
      type: object
      required: [id, flight_id, max_weight_kg, current_weight_kg, items]
      properties:
        id:
          type: string
          format: uuid
        flight_id:
          type: string
          format: uuid
        max_weight_kg:
          type: integer
        current_weight_kg:
          type: integer
        items:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CargoItem'

    AddCargoItemRequest:
      type: object
      required: [cargo_type, weight_kg, description]
      properties:
        cargo_type:
          $ref: '#/components/schemas/CargoType'
        weight_kg:
          type: integer
          minimum: 1
        passenger_id:
          type: string
          format: uuid
          description: Required by business rules when cargo_type is Luggage.
        description:
          type: string
          minLength: 5

    MoveCargoItemRequest:
      type: object
      required: [item_id, new_cargo_id]
      properties:
        item_id:
          type: string
          format: uuid
        new_cargo_id:
          type: string
          format: uuid

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Invalid JSON, UUID, date, or request field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested flight, manifest, or item was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Request violates cargo weight or ownership rules.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'